<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <title>Absensi Ronda Malam RT</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .header-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    #sectionKetidakhadiran button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    footer {
      width: 100%;
      text-align: center;
      padding: 12px 20px;
      font-size: 12px;
      font-weight: 400;
      color: #808080;
      margin-top: 0;
    }
  </style>
</head>
<body class="min-h-screen pb-10">
  <!-- HEADER GRADIENT -->
  <div class="header-gradient text-white pt-6 pb-16 px-4 rounded-b-3xl shadow-xl relative">
    <div class="max-w-md mx-auto text-center space-y-2">
      <div class="bg-white/10 backdrop-blur-md px-3 py-1 rounded-full inline-block border border-white/20">
        <i class="far me-1.5 fa-clock text-cyan-300"></i>
        <span id="liveDate" class="text-xs text-slate-200"></span>
        <span id="liveClock" class="font-mono font-bold text-sm text-yellow-300 ms-2"></span>
      </div>
      <h1 class="text-base font-bold tracking-wide pt-1">ABSENSI DAN INFORMASI RONDA</h1>
      
      <div class="text-sm font-medium text-blue-100 flex items-center justify-center gap-2 pt-1">
        <i class="fas fa-user-circle text-cyan-400 text-base"></i>
        <span>Petugas: <strong id="officerNameDisplay" class="text-white font-bold"> -</strong></span>
        
        <button id="btnLogout" onclick="doLogout()" class="hidden bg-rose-500/80 hover:bg-rose-600 active:scale-95 text-white text-[12px] font-bold px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 shadow">
          <i class="fas fa-power-off"></i> Keluar
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="max-w-md mx-auto px-4 -mt-10 relative z-10 space-y-5">
    <!-- KOTAK LOGIN -->
    <div id="loginCard" class="glass-card p-4 rounded-2xl shadow-lg border border-slate-100 mx-2">
      <label class="text-base font-bold text-slate-600 mb-2.5 flex items-center gap-1.5">
        <i class="fas fa-key text-blue-600 me-1"></i> Silakan Login
      </label>
      <div class="flex gap-2">
        <input
          type="text"
          id="loginCodeInput"
          placeholder="Login disini"
          class="w-full px-3.5 py-2.5 text-base border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono tracking-wide"
          onkeydown="if(event.key==='Enter') doLogin()"
        >
        <button
          onclick="doLogin()"
          class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-all shadow-md flex items-center gap-1.5 shrink-0"
        >
          <span>Masuk</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </div>
      <p id="loginStatus" class="text-xs font-medium mt-2 hidden"></p>
    </div>

    <!-- SEKSI KEHADIRAN -->
    <div id="sectionKehadiran" class="hidden px-3">
      <h2 class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-1.5">
        <i class="fas fa-fingerprint text-emerald-600 me-1.5"></i>
        Absen Kehadiran
      </h2>
      <div class="grid grid-cols-3 gap-2.5">
        <!-- ABSEN PULANG -->
        <button
          id="btnAbsenPulang"
          onclick="triggerAbsen('Absen Pulang')"
          disabled
          class="w-full min-h-[125px] py-3 px-2 rounded-xl text-white font-bold flex flex-col items-center justify-center shadow-md transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed bg-rose-600 hover:bg-rose-700"
        >
          <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center text-base mb-2">
            <i class="fas fa-sign-out-alt"></i>
          </div>
          <div class="text-center leading-tight text-base">
            Absen Pulang
          </div>
          <div class="text-[12px] font-normal opacity-85 mt-1">
            04.00 – 05.00
          </div>
        </button>

        <!-- CATATAN KEJADIAN -->
        <button
          id="btnCatatanKejadian"
          onclick="openNoteModal()"
          disabled
          class="w-full min-h-[125px] py-3 px-2 rounded-xl text-white font-bold flex flex-col items-center justify-center shadow-md transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed bg-amber-500 hover:bg-amber-600"
        >
          <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center text-base mb-2">
            <i class="fas fa-clipboard-list"></i>
          </div>
          <div class="text-center leading-tight text-base">
            Catatan Khusus
          </div>
          <div class="text-[12px] font-normal opacity-90 mt-1 text-center">
            Saat bertugas
          </div>
        </button>

        <!-- ABSEN MASUK -->
        <button
          id="btnAbsenMasuk"
          onclick="triggerAbsen('Absen Masuk')"
          disabled
          class="w-full min-h-[125px] py-3 px-2 rounded-xl text-white font-bold flex flex-col items-center justify-center shadow-md transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed bg-emerald-600 hover:bg-emerald-700"
        >
          <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center text-base mb-2">
            <i class="fas fa-sign-in-alt"></i>
          </div>
          <div class="text-center leading-tight text-base">
            Absen Masuk
          </div>
          <div class="text-[12px] font-normal opacity-85 mt-1">
            00.00 – 00.30
          </div>
        </button>

      </div>
    </div>

    <!-- SEKSI KETIDAKHADIRAN -->
    <div id="sectionKetidakhadiran" class="hidden px-3">
      <h2 class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-1.5">
        <i class="fas fa-user-shield text-purple-600 text-sm me-1.5"></i>
        Absen Ketidakhadiran
      </h2>
      <div class="grid grid-cols-3 gap-2.5">
        <button
          id="btnAlpa"
          onclick="triggerKetidakhadiran('Alpa')"
          class="py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-sm font-bold shadow flex flex-col items-center justify-center gap-1"
        >
          <i class="fas fa-user-times text-base"></i>
          Alpa
        </button>

        <button
          id="btnNonPresensi"
          onclick="triggerKetidakhadiran('Non Presensi')"
          class="py-3 bg-slate-600 hover:bg-slate-700 text-white rounded-xl text-sm font-bold shadow flex flex-col items-center justify-center gap-1"
        >
          <i class="fas fa-minus-circle text-base"></i>
          Non Presensi
        </button>

        <button
          id="btnIzin"
          onclick="triggerKetidakhadiran('Izin')"
          class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow flex flex-col items-center justify-center gap-1"
        >
          <i class="fas fa-file-signature text-base"></i>
          Izin
        </button>

      </div>
    </div>

    <!-- SEKSI INFORMASI KEHADIRAN -->
    <div id="infoCard" class="glass-card p-4 rounded-2xl shadow-lg border border-slate-100 mx-2">
      <div class="flex items-center justify-between pb-2.5">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
          <i class="fas fa-info-circle text-blue-600 me-1"></i>
          Informasi Kehadiran
        </h2>
        <span
          id="relativeTimeDisplay"
          class="text-xs text-gray-400 font-normal px-2.5 py-1 rounded-full"
        ></span>
      </div>
      <div id="infoContentContainer" class="space-y-2 mt-1">
        <div class="text-center py-4 text-xs text-slate-400">
          <i class="fas fa-spinner fa-spin me-1"></i>
          Memuat data...
        </div>
      </div>
      <div class="pt-3 mt-3">
        <h3 class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-1.5">
          <i class="fas fa-book-open text-amber-500"></i>
          Catatan Khusus
        </h3>
        <div id="notesTableContainer" class="overflow-x-auto">
          <p class="text-sm text-slate-400 italic">
            Belum ada catatan kejadian/keadaan khusus
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ALERT -->
  <div id="alertModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl space-y-3">
      <div id="modalIcon" class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 mx-auto flex items-center justify-center text-xl">
        <i class="fas fa-check"></i>
      </div>
      <h3 id="modalTitle" class="text-base font-bold text-slate-800">Informasi</h3>
      <p id="modalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
      <button onclick="closeModal('alertModal')" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition">
        Selesai
      </button>
    </div>
  </div>

  <!-- MODAL CATATAN KEJADIAN -->
  <div id="noteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3.5">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
          <i class="fas fa-edit text-amber-500"></i> Input Catatan Kejadian
        </h3>
        <button onclick="closeModal('noteModal')" class="text-slate-400 hover:text-slate-600 text-base">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <textarea id="noteInput" rows="3" placeholder="Tuliskan catatan kejadian..." class="w-full p-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
      <div class="flex gap-2">
        <button onclick="closeModal('noteModal')" class="w-1/2 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-sm font-bold">Batal</button>
        <button onclick="saveNote()" class="w-1/2 py-2.5 bg-amber-500 text-white rounded-xl text-sm font-bold hover:bg-amber-600 shadow">Simpan</button>
      </div>
    </div>
  </div>
  <footer>Powered by Anto Design Concept &copy; 2026</footer>
  
  <!-- JAVASCRIPT LOGIC -->
  <script>
    // TEMPATKAN URL DEPLOYMENT WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx3PfqPJ_D5mLLESdyCaOayN75wwpfNySqT221MEym-5fzYxnzLaWWvc9k09nSTq8fPug/exec";

    let currentUser = null;
    let todayAttendanceData = {};
    let todayNotesData = [];

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${hh}:${mm}:${ss}`;
      const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', options);
      evaluateButtonStates(now);
    }
    setInterval(updateClock, 1000);
    updateClock();
    setInterval(fetchData, 10000);

    function doLogin() {
      const code = document.getElementById('loginCodeInput').value.trim();
      if (!code) return;
      const statusEl = document.getElementById('loginStatus');
      statusEl.className = "text-xs font-medium mt-2 text-blue-600 flex items-center gap-1";
      statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa kode...';
      statusEl.classList.remove('hidden');

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', code: code })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser = res;
          document.getElementById('officerNameDisplay').innerText = res.user.name;
          document.getElementById('btnLogout').classList.remove('hidden');
          
          statusEl.className = "text-xs font-medium mt-2 text-emerald-600";
          statusEl.innerText = `Login Berhasil (${res.user.role.toUpperCase()})`;
          
          const loginCode = String(currentUser.code || '').trim().toUpperCase();
          const isAdminUser = (loginCode === 'ADMIN01' || loginCode === 'ADMIN02');
          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();
          const isLoginWindow = currentMinutes >= 0 && currentMinutes <= 300;

          if (isAdminUser) {
            document.getElementById('sectionKehadiran').classList.add('hidden');
          } else if (!isLoginWindow) {
            document.getElementById('sectionKehadiran').classList.add('hidden');
            document.getElementById('loginStatus').innerHTML = '<i class="fas fa-clock me-1"></i> Absen berlaku mulai jam 00.00 s.d 05.00';
            document.getElementById('loginStatus').className = "text-xs font-medium mt-2 text-amber-600";
          } else {
            document.getElementById('sectionKehadiran').classList.remove('hidden');
          }
          evaluateButtonStates(new Date());
          updateClock();
          fetchData();
        } else {
          statusEl.className = "text-xs font-medium mt-2 text-red-600";
          statusEl.innerText = res.message;
        }
      })
      .catch(err => {
        statusEl.className = "text-xs font-medium mt-2 text-red-600";
        statusEl.innerText = "Gagal terhubung ke server.";
      });
    }

    function doLogout() {
      currentUser = null;
      document.getElementById('officerNameDisplay').innerText = " -";
      document.getElementById('loginCodeInput').value = "";
      document.getElementById('loginStatus').classList.add('hidden');
      document.getElementById('btnLogout').classList.add('hidden');
      document.getElementById('sectionKehadiran').classList.add('hidden');
      document.getElementById('sectionKetidakhadiran').classList.add('hidden');
      updateClock();
    }

    function evaluateButtonStates(now) {
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const currentMinutes = hours * 60 + minutes;

      const isMasukWindow = (currentMinutes >= 0 && currentMinutes <= 30);     // 00.00 - 00.30
      const isPulangWindow = (currentMinutes >= 240 && currentMinutes <= 300); // 04.00 - 05.00
      const isAdminWindow = (currentMinutes >= 0 && currentMinutes <= 360);    // 00.00 - 06.00

      let hasMasuk = false;
      let hasPulang = false;

      if (currentUser && currentUser.user && todayAttendanceData[currentUser.user.name]) {
        hasMasuk = todayAttendanceData[currentUser.user.name].masuk !== "-";
        hasPulang = todayAttendanceData[currentUser.user.name].pulang !== "-";
      }

      const btnMasuk = document.getElementById('btnAbsenMasuk');
      const btnPulang = document.getElementById('btnAbsenPulang');
      const btnKejadian = document.getElementById('btnCatatanKejadian');

      btnMasuk.disabled = true;
      btnPulang.disabled = true;
      btnKejadian.disabled = true;

      if (currentUser) {
        if (isMasukWindow && !hasMasuk) {
          btnMasuk.disabled = false;
        }
        if (hasMasuk) {
          btnMasuk.disabled = true;
          btnKejadian.disabled = hasPulang || currentMinutes >= 300;
          if (isPulangWindow && !hasPulang) {
            btnPulang.disabled = false;
          }
        }

        const adminSection = document.getElementById('sectionKetidakhadiran');
        const btnIzin = document.getElementById('btnIzin');
        const btnAlpa = document.getElementById('btnAlpa');
        const btnNonPresensi = document.getElementById('btnNonPresensi');

        const loginCode = String(currentUser.code || '').trim().toUpperCase();
        const isAdminUser = (loginCode === 'ADMIN01' || loginCode === 'ADMIN02');

        if (isAdminUser) {
          adminSection.classList.remove('hidden');
          const adminButtons = [btnIzin, btnAlpa, btnNonPresensi];
          adminButtons.forEach(btn => {
            if (btn) btn.disabled = !isAdminWindow;
          });
        } else {
          adminSection.classList.add('hidden');
        }
      } else {
        document.getElementById('sectionKetidakhadiran').classList.add('hidden');
      }
    }

    function fetchData() {
      fetch(`${WEB_APP_URL}?action=getTodayData`)
        .then(res => res.json())
        .then(res => {
          if (res && res.success) {
            todayAttendanceData = res.attendance;
            todayNotesData = res.notes;
            renderInformationSection();
            if (currentUser) updateClock();
          }
        })
        .catch(err => console.error("Gagal sinkronisasi data:", err));
    }

    function renderInformationSection() {
      const now = new Date();
      const currentHours = now.getHours();

      if (currentHours === 23) {
        document.getElementById('infoContentContainer').innerHTML = `
          <div class="text-center py-6 text-slate-400 text-sm">
            <i class="fas fa-moon text-lg mb-1 block text-slate-300"></i>
            Informasi ronda menunggu hari berikutnya.
          </div>`;
        document.getElementById('notesTableContainer').innerHTML = `<p class="text-sm text-slate-400 italic">Data telah direset jam 23.00 WITA.</p>`;
        document.getElementById('relativeTimeDisplay').innerText = "";
        return;
      }

      let containerHtml = "";
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const officers = ["Maliki", "Abd. Rauf Samad"];

      officers.forEach(nama => {
        const item = todayAttendanceData[nama] || { masuk: "-", pulang: "-", status: "menunggu", lastUpdated: null };

        const sudahMasuk = item.masuk !== "-";
        const sudahPulang = item.pulang !== "-";
        let status = item.status;

        if (["Izin", "Alpa", "Non Presensi"].includes(item.status)) {
          status = item.status;
        } else if (sudahMasuk && sudahPulang) {
          status = "Hadir";
        } else if (sudahMasuk && !sudahPulang) {
          if (nowMinutes > 300) {
            status = "ATL";
          } else {
            status = "sedang bertugas";
          }
        } else if (!sudahMasuk && sudahPulang) {
          status = "Telat";
        } else {
          if (nowMinutes > 30) {
            status = "?";
          } else {
            status = "menunggu";
          }
        }

        const statusBadge = getStatusBadge(status);
        containerHtml += `
          <div class="py-2 px-3 rounded-lg bg-blue-50 border border-slate-200 flex items-center justify-between">
            <div>
              <div class="text-sm font-bold text-slate-800">${nama}</div>
              <div class="text-[13px] text-slate-500 mt-0.5 flex items-center">
                <span class="pr-2">
                  <i class="fas fa-sign-in-alt text-emerald-600"></i> ${item.masuk}
                </span>
                <span class="border-l border-slate-300 pl-2">
                  <i class="fas fa-sign-out-alt text-rose-600"></i> ${item.pulang}
                </span>
              </div>
            </div>
            <div>${statusBadge}</div>
          </div>`;
      });

      document.getElementById('infoContentContainer').innerHTML = containerHtml;
      const relDisplay = document.getElementById('relativeTimeDisplay');
      relDisplay.innerText = getRelativeTime(now);

      if (todayNotesData.length > 0) {
        let tableHtml = `
          <table class="w-full text-left text-sm bg-white rounded-xl overflow-hidden border border-slate-200">
            <thead>
              <tr class="bg-white text-slate-700 border-b">
                <th class="p-2 font-semibold">Petugas</th>
                <th class="p-2 font-semibold">Jam</th>
                <th class="p-2 font-semibold">Kejadian/Keadaan</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">`;
        
        todayNotesData.forEach(n => {
          tableHtml += `
            <tr>
              <td class="p-2 font-medium text-slate-800">${escapeHtml(n.nama)}</td>
              <td class="p-2 text-slate-500">${escapeHtml(n.waktu)}</td>
              <td class="p-2 text-slate-600">${escapeHtml(n.catatan)}</td>
            </tr>`;
        });
        tableHtml += `</tbody></table>`;
        document.getElementById('notesTableContainer').innerHTML = tableHtml;
      } else {
        document.getElementById('notesTableContainer').innerHTML = `<p class="text-[12px] text-slate-400 italic">Tidak ada catatan kejadian/keadaan hari ini.</p>`;
      }
    }

    function getStatusBadge(status) {
      switch(status) {
        case "sedang bertugas":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-amber-100 text-amber-700 animate-pulse"><i class="fas fa-shield-alt me-1"></i>Bertugas</span>`;
        case "Hadir":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-emerald-100 text-emerald-700"><i class="fas fa-check-circle me-1"></i>Hadir</span>`;
        case "ATL":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-orange-100 text-orange-700"><i class="fas fa-exclamation-triangle me-1"></i>ATL</span>`;
        case "Izin":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-indigo-100 text-indigo-700">Izin</span>`;
        case "Alpa":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-red-100 text-red-700">Alpa</span>`;
        case "Non Presensi":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-slate-200 text-slate-700">Non Presensi</span>`;
        case "Telat":
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-orange-100 text-orange-700"><i class="fas fa-clock me-1"></i>Telat</span>`;
        default:
          return `<span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-500"><i class="fas fa-clock me-1"></i>Menunggu</span>`;
      }
    }

    // Lama waktu (jam & menit) sejak pukul 04.30 hari ini sampai sekarang.
    // Sebelum pukul 04.30 tidak ditampilkan apa pun.
    function getRelativeTime(now = new Date()) {
      const startMinutes = 4 * 60 + 30; // 04.30
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const diffMin = nowMinutes - startMinutes;

      if (diffMin < 0) return "";
      if (diffMin === 0) return "Baru saja";

      const hours = Math.floor(diffMin / 60);
      const minutes = diffMin % 60;

      if (hours === 0) return `${minutes} menit`;
      if (minutes === 0) return `${hours} jam`;
      return `${hours} jam ${minutes} menit`;
    }

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function triggerAbsen(action) {
      if (!currentUser) return;
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveAttendance',
          payload: {
            code: currentUser.code,
            name: currentUser.user.name,
            action: action
          }
        })
      })
      .then(res => res.json())
      .then(res => {
        showModal("Sukses", `Data ${action.toLowerCase()} telah disimpan`, "emerald");
        if (res.data) {
          todayAttendanceData = res.data.attendance;
          todayNotesData = res.data.notes;
          renderInformationSection();
          updateClock();
        }
      })
      .catch(() => showModal("Gagal", "Tidak dapat terhubung ke server. Coba lagi.", "rose"));
    }

    function triggerKetidakhadiran(action) {
      if (!currentUser || !(currentUser.code === "Admin01" || currentUser.code === "Admin02")) return;
      let targets = [];
      if (currentUser.code === "Admin01") {
        targets = ["Abd. Rauf Samad"];
      } else if (currentUser.code === "Admin02") {
        targets = ["Maliki"];
      }
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveAttendance',
          payload: {
            code: currentUser.code,
            name: currentUser.user.name,
            action: action,
            targetOfficers: targets
          }
        })
      })
      .then(res => res.json())
      .then(res => {
        showModal("Berhasil Menyimpan", `Status ${action} telah diterapkan untuk ${targets.join(', ')}.`, "indigo");
        if (res.data) {
          todayAttendanceData = res.data.attendance;
          todayNotesData = res.data.notes;
          renderInformationSection();
          updateClock();
        }
      })
      .catch(() => showModal("Gagal", "Tidak dapat terhubung ke server. Coba lagi.", "rose"));
    }

    function openNoteModal() {
      document.getElementById('noteInput').value = "";
      document.getElementById('noteModal').classList.remove('hidden');
    }

    function saveNote() {
      if (!currentUser) return;
      const note = document.getElementById('noteInput').value.trim();
      if (!note) return;
      closeModal('noteModal');
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveAttendance',
          payload: {
            code: currentUser.code,
            name: currentUser.user.name,
            action: "Catatan Kejadian",
            note: note
          }
        })
      })
      .then(res => res.json())
      .then(res => {
        showModal("Berhasil", "Catatan kejadian telah disimpan.", "amber");
        if (res.data) {
          todayAttendanceData = res.data.attendance;
          todayNotesData = res.data.notes;
          renderInformationSection();
          updateClock();
        }
      })
      .catch(() => showModal("Gagal", "Catatan gagal disimpan. Coba lagi.", "rose"));
    }

    function showModal(title, message, themeColor) {
      const themes = {
        emerald: 'bg-emerald-100 text-emerald-600',
        indigo: 'bg-indigo-100 text-indigo-600',
        amber: 'bg-amber-100 text-amber-600',
        rose: 'bg-rose-100 text-rose-600',
        blue: 'bg-blue-100 text-blue-600'
      };
      document.getElementById('modalIcon').className =
        `w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl ${themes[themeColor] || themes.blue}`;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      document.getElementById('alertModal').classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    fetchData();
  </script>
</body>
</html>
